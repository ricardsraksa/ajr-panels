<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Voice log · AJR</title>
<style>
html{background:#f0f0f3}
body{margin:0;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;color:#1d1d1f;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{max-width:380px;text-align:center}
h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 8px}
p{font-size:13.5px;color:#6e6e73;line-height:1.55;margin:0 0 16px}
a{display:inline-block;min-height:38px;padding:9px 18px;border-radius:8px;background:#B0544A;color:#fff;
  text-decoration:none;font-weight:600;font-size:13px}
a:hover{background:#8F4238}
</style>
<script>
/* The voice popup was merged into the Deals page in v2 — one closer surface,
   one capture bar (type or speak), same mic. Old bookmarks, the installed PWA
   and the call-watcher deep links (?deal= / ?after=) still land somewhere
   useful: carry the deal through so the capture bar opens pinned to it. */
(function () {
  try {
    var q = new URLSearchParams(location.search);
    var deal = q.get('deal');
    location.replace('deals.html' + (deal ? '?deal=' + encodeURIComponent(deal) : ''));
  } catch (e) { location.replace('deals.html'); }
})();
</script>
</head>
<body>
<div class="card">
  <h1>The voice log moved</h1>
  <p>Logging a call now happens on the Deals page — same mic, same sentence, one screen.</p>
  <a href="deals.html">Go to Deals</a>
</div>
</body>
</html>
