<style>
.demo-banner{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);text-align:center;padding:6px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--side);margin-bottom:14px}
.colw{max-width:1080px}
.pg-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pg-head h1{font:700 21px var(--font);color:var(--ink)}
.pg-head .sub{color:var(--muted);font-size:13px}
.pg-head .counts{font:600 11px var(--mono);color:var(--ink-3);background:var(--divider);
  border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.pg-head .sp{flex:1}
.pg-head .kd{color:#3a4ed6;font-size:12.5px;font-weight:600;text-decoration:none}
.pg-head .kd:hover{text-decoration:underline}
.stale{border:1px solid #ecc9a8;background:#fdf4ea;color:#9a5b24;border-radius:10px;
  padding:9px 13px;font-size:12.5px;font-weight:600;margin-top:12px}
.empty{border:1px dashed var(--line-2);border-radius:12px;padding:36px 20px;text-align:center;color:var(--muted);font-size:13.5px}
/* the whole point: everything on one page. two columns once there's room. */
.sheet{margin-top:18px;columns:2;column-gap:34px}
@media(max-width:900px){.sheet{columns:1}}
.grp{break-inside:avoid;margin:0 0 18px}
.grp-h{font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:7px}
.it{font-size:13px;line-height:1.5;color:#4a463e;padding:4px 0 4px 12px;position:relative}
.it::before{content:'';position:absolute;left:2px;top:11px;width:4px;height:4px;border-radius:50%;background:var(--off)}
.it b{color:var(--ink);font-weight:650}
.it a{color:var(--muted);font-size:11.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.it a:hover{color:#3a4ed6;text-decoration:underline}
.it .nolink{color:#a49d8e;font-size:11.5px;white-space:nowrap}
[hidden]{display:none!important}

<style id="v2-theme">
@view-transition{navigation:auto}
:root{
  --bg:#f0f0f3; --side:rgba(251,251,253,.78); --card:#fbfbfd; --rowsel:rgba(0,0,0,.022);
  --line:rgba(0,0,0,.07); --line-2:rgba(0,0,0,.12); --divider:rgba(0,0,0,.05);
  --ink:#1d1d1f; --ink-2:#3a3a3c; --ink-3:#6e6e73; --muted:#6e6e73; --muted-2:#98989d; --off:#b9b9bf;
  /* accent = the action colour (buttons, active nav, links, cursor row).
     --go stays green and means money/success/done only. Splitting them is the
     whole point: a "Log" button and "cash collected" are not the same idea. */
  --accent:#B0544A; --accent-hi:#8F4238; --accent-tint:rgba(176,84,74,.07); --accent-line:rgba(176,84,74,.35);
  --go:#1F7A4D; --go-hi:#17603C; --go-tint:rgba(31,122,77,.08); --go-line:rgba(31,122,77,.3); --done:rgba(31,122,77,.04);
  --red:#C7392E; --amber:#9A6A00; --amber-tint:rgba(154,106,0,.09);
  --ai:#7c56c9; --ai-line:#e2d9f4; --ai-tint:#f6f2fb;
  --font:-apple-system,'SF Pro Text','SF Pro Display',system-ui,'Instrument Sans',sans-serif;
  --mono:ui-monospace,'SF Mono','IBM Plex Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hi)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
input::placeholder,textarea::placeholder{color:var(--off)}

/* layout */
.v2-shell{display:flex;min-height:100vh}
.v2-side{width:228px;flex:none;border-right:1px solid rgba(0,0,0,.06);background:var(--side);padding:22px 12px 16px;
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;
  align-self:flex-start} /* flex would stretch it and break position:sticky */
.v2-side .wm{font-weight:700;font-size:15px;letter-spacing:-.01em;padding:0 10px 18px}
.v2-side .grp{font:600 10.5px var(--font);letter-spacing:.1em;color:var(--muted-2);padding:4px 10px}
.v2-side .grp.gap{padding-top:14px}
.v2-side a.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink-2);font-size:13.5px}
.v2-side a.nav:hover{background:rgba(0,0,0,.045);color:var(--ink)}
.v2-side a.nav .ic{flex:none;opacity:.62}
.v2-side a.nav.on .ic{opacity:1}
.v2-side a.nav.on{background:rgba(176,84,74,.1);color:var(--accent);font-weight:600}
.v2-side a.nav.on:hover{background:rgba(176,84,74,.14);color:var(--accent)}
.v2-side .badge-n{margin-left:auto;font:600 11.5px var(--mono);font-variant-numeric:tabular-nums;border-radius:99px;padding:0}
.v2-side a.nav:not(.on) .badge-n{color:var(--muted-2)}
.v2-side .badge-red{margin-left:auto;font-size:11px;color:var(--red);font-weight:600}
.v2-side .badge-dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.v2-side .sp{flex:1}
.v2-side .krow{display:flex;align-items:center;gap:8px;padding:8px 10px;color:var(--muted-2);font-size:12px;cursor:pointer}
.v2-side .krow kbd{margin-left:auto;font:600 11px var(--mono);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;background:#fff;color:var(--ink-3)}
.v2-side .me{display:flex;align-items:center;gap:9px;padding:10px 10px 2px;border-top:1px solid var(--line);margin-top:6px}
.v2-side .me{border-top:1px solid rgba(0,0,0,.06)}
.v2-side .me .av{width:27px;height:27px;border-radius:50%;background:var(--ink);color:#fbfbfd;display:inline-flex;
  align-items:center;justify-content:center;font:600 11px var(--font);flex:none}
.v2-side .me .nm{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2-side .me .rl{display:block;font-size:11px;color:var(--muted-2)}
.v2-side .me .out{margin-left:auto;color:var(--muted-2);font-size:11px}
/* No global width cap. A reading width suits a chat or a queue and starves a
   13-column table — pages that want one set .colw themselves. */
.v2-main{flex:1;min-width:0;padding:30px 36px 80px}
.colw{width:100%}
@media(max-width:900px) and (min-width:761px){.v2-side{width:66px;padding:18px 8px}.v2-side .wm,.v2-side .grp,.v2-side .krow,.v2-side .me .nm,.v2-side .me .rl{display:none}}
/* phone: the sidebar becomes a scrolling top strip. As a 64px rail it ate a
   third of the screen and wrapped every label onto three lines. */
@media(max-width:760px){
  .v2-shell{display:block}
  .v2-side{flex-direction:row;width:auto;height:auto;align-items:center;gap:6px;padding:8px 10px;
    border-right:none;border-bottom:1px solid rgba(0,0,0,.06);overflow-x:auto;-webkit-overflow-scrolling:touch;
    position:sticky;top:0;z-index:20}
  .v2-side::-webkit-scrollbar{display:none}
  .v2-side .wm,.v2-side .grp,.v2-side .krow,.v2-side .sp,.v2-side .me .nm,.v2-side .me .rl{display:none}
  .v2-side a.nav{white-space:nowrap;padding:9px 13px;min-height:40px;font-size:13px}
  .v2-side .badge-n,.v2-side .badge-red{margin-left:6px}
  .v2-side .me{border-top:none;margin:0 0 0 auto;padding:0 0 0 6px}
  .v2-main{padding:18px 14px 70px}
  .v2-h{flex-wrap:wrap;gap:8px}
  .v2-h h1{font-size:21px}
}

/* headers */
.v2-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.v2-h h1{font-size:23px;font-weight:700;letter-spacing:-.02em}
.v2-h .sub{color:var(--muted);font-size:13px}
.v2-h .sp{flex:1}
.v2-lab{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}

/* chips */
.v2-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.v2-chip{min-height:30px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--card);
  color:var(--ink-2);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.v2-chip:hover{border-color:var(--muted-2)}
.v2-chip.on{background:var(--ink);color:#fbfbfd;border-color:var(--ink)}
.v2-chip .n{font-family:var(--mono);font-size:11px;opacity:.65}
.v2-chip.green{background:var(--go-tint);border-color:var(--go-line);color:var(--go)}
.v2-chip.red{background:#fbf0ed;border-color:#e8cec6;color:var(--red)}

/* buttons */
.v2-btn{min-height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);background:#fff;
  color:var(--ink-2);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .12s ease}
.v2-btn:hover:not(:disabled){border-color:var(--muted-2);color:var(--ink)}
.v2-btn:active:not(:disabled){transform:scale(.97)}
.v2-btn:disabled{opacity:.45;cursor:not-allowed}
.v2-btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.v2-btn.go:hover:not(:disabled){background:var(--accent-hi);border-color:var(--accent-hi);color:#fff}
.v2-btn.goline{background:transparent;border-color:var(--accent-line);color:var(--accent)}
.v2-btn.goline:hover:not(:disabled){background:var(--accent-tint);color:var(--accent);border-color:var(--accent-line)}
/* completion, not action: "Sent", "Mark as cold", "logged" all read green */
.v2-btn.doneline{background:#fff;border-color:var(--go-line);color:var(--go)}
.v2-btn.doneline:hover:not(:disabled){background:var(--go-tint);color:var(--go);border-color:var(--go-line)}
.v2-btn.dark{background:var(--ink);border-color:var(--ink);color:#fbfbfd}
.v2-btn.dark:hover:not(:disabled){filter:brightness(1.35)}
.v2-btn.dash{border-style:dashed;color:var(--muted);font-weight:500;background:transparent}
.v2-btn.dash:hover{color:var(--ink-2)}
.v2-btn.sm{min-height:27px;padding:0 11px;font-size:11.5px;border-radius:7px}

/* inputs */
.v2-in{min-height:34px;padding:7px 12px;background:#fff;border:1px solid var(--line-2);border-radius:8px;
  color:var(--ink);font-size:13px;width:100%;
  transition:border-color .16s ease, box-shadow .16s ease, background-color .16s ease}
.v2-in:hover{border-color:var(--muted-2)}
.v2-in:focus{border-color:var(--ink-3);box-shadow:0 0 0 3px rgba(33,31,27,.07)}
/* native selects render differently on every OS — draw our own chevron so the
   closed state matches the rest of the paper UI */
select.v2-in{cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a8375' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;background-size:14px}
select.v2-in:hover{background-color:var(--rowsel)}
/* the OPEN list of a native select is drawn by the OS (dark grey on macOS) and
   cannot be styled — so on pointer devices we draw our own and keep the real
   <select> underneath for state, change events and keyboard control */
#v2-menu{position:fixed;z-index:200;background:var(--card);border:1px solid var(--line);border-radius:11px;
  box-shadow:0 14px 38px -10px rgba(33,31,27,.32), 0 2px 6px rgba(33,31,27,.06);
  padding:5px;max-height:min(58vh,340px);overflow-y:auto;min-width:150px;
  animation:v2menu .13s ease-out}
@keyframes v2menu{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#v2-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 10px 8px 8px;border-radius:8px;font:500 13px var(--font);color:var(--ink-2);
  white-space:nowrap;cursor:pointer;transition:background-color .12s ease,color .12s ease}
#v2-menu button:hover,#v2-menu button.cur{background:var(--divider);color:var(--ink)}
#v2-menu button.on{color:var(--go-hi);font-weight:600}
#v2-menu button.on:hover{background:var(--go-tint)}
#v2-menu .tick{width:14px;height:14px;flex:none;opacity:0}
#v2-menu button.on .tick{opacity:1}
select.v2-in:disabled{opacity:.55;cursor:not-allowed}
input[type=date].v2-in{cursor:pointer}
textarea.v2-in{min-height:76px;resize:vertical;line-height:1.55}

/* cards + tables */
.v2-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.03);overflow:hidden}
.v2-thead{display:grid;gap:10px;padding:9px 18px;font:600 10.5px var(--font);letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted-2);border-bottom:1px solid rgba(0,0,0,.055)}
.v2-row{display:grid;gap:10px;padding:10px 18px;align-items:center;border-top:1px solid var(--divider);
  transition:background-color .15s ease}
.v2-row:first-of-type{border-top:none}
.v2-row:hover{background:var(--rowsel)}
.v2-scroll{overflow-x:auto}
.v2-empty{padding:30px 18px;text-align:center;color:var(--muted)}

/* semantic bits */
.v2-age{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:600;
  color:var(--ink-3);background:rgba(0,0,0,.05);border-radius:5px;padding:2px 6px}
.v2-age.warn{color:var(--amber);background:var(--amber-tint)}
.v2-age.late{color:var(--red);background:rgba(199,57,46,.09)}
.v2-ai{display:inline-flex;align-items:center;gap:4px;font:600 10.5px var(--mono);color:var(--ai);
  border:1px solid var(--ai-line);border-radius:99px;padding:1px 7px;white-space:nowrap}
.v2-money{font-family:var(--mono);font-weight:600;color:var(--go)}

/* toasts */
.v2-toasts{position:fixed;z-index:80;bottom:26px;left:50%;transform:translateX(-50%);display:flex;
  flex-direction:column;align-items:center;gap:9px;width:max-content;max-width:calc(100vw - 32px)}
.v2-toast{display:flex;align-items:center;gap:14px;background:rgba(28,28,30,.88);color:#fbfbfd;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:none;
  border-radius:99px;padding:11px 12px 11px 18px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);
  animation:v2toast .34s cubic-bezier(.24,1.1,.32,1)}
@keyframes v2toast{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.v2-toast.err{background:rgba(146,44,35,.92);color:#fbfbfd}
.v2-toast .sp{flex:1}
.v2-toast button{background:rgba(255,255,255,.14);color:#F3C9C2;font-weight:600;font-size:12.5px;
  padding:5px 12px;border-radius:99px}
.v2-toast button:hover{background:rgba(255,255,255,.22)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<!--/baked:head-->

      <span class="counts" id="bCounts" hidden></span>
      <span class="sp"></span>
      <select class="v2-in" id="daySel" hidden style="width:auto;min-height:30px;font-size:12.5px"></select>
      <a class="kd" id="kdLink" href="#" target="_blank" rel="noopener" hidden>📌 Key Developments →</a>
    </div>
    <div class="stale" id="staleNote" hidden></div>
    <div id="content"></div>
  </div>
</main>
<script type="module">
import * as core from './crm-core.js?v=20260817g';
const session = await core.requireAuth();
if (session) {
await core.installChrome({ active: 'briefing' });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
if (core.isDemo) $('demoBanner').hidden = false;

const item = (it) => `<div class="it"><b>${esc(it.t)}</b>${it.d ? ' — ' + esc(it.d) : ''} ${
  it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.src)} ↗</a>`
         : `<span class="nolink">${esc(it.src)}</span>`}</div>`;
const group = (g) => `<section class="grp"><div class="grp-h">${esc(g.tag)}</div>${(g.items || []).map(item).join('')}</section>`;

function show(b, isToday) {
  $('bDate').textContent = b.date || '';
  $('bCounts').hidden = !b.counts;
  if (b.counts) $('bCounts').textContent = b.counts;
  $('kdLink').hidden = !(b.keydev_url && b.keydev_url !== '#');
  if (b.keydev_url && b.keydev_url !== '#') $('kdLink').href = b.keydev_url;
  // the stale warning is about TODAY's automation, not about browsing history
  $('staleNote').hidden = true;
  if (isToday && b.iso) {
    const age = (Date.now() - new Date(b.iso + 'T07:00:00')) / 36e5;
    if (age > 48) { $('staleNote').textContent = 'This briefing is from ' + b.date + ' — the daily automation may not have run since.'; $('staleNote').hidden = false; }
  }
  const groups = b.groups || [];
  $('content').innerHTML = groups.length
    ? `<div class="sheet">${groups.map(group).join('')}</div>`
    : '<div class="empty">Nothing published for this day.</div>';
}
try {
  const b = await core.loadBriefing();
  if (!b) {
    $('content').innerHTML = '<div class="empty">No briefing published yet — the daily automation writes one here every morning at 7.</div>';
  } else {
    show(b, true);
    core.markBriefingSeen(b.updated_at || b.iso || '');
  }
  // previous days, loaded after the current one so history never delays today
  try {
    const days = await core.briefingDays();
    if (days.length > 1 || (days.length === 1 && b && days[0] !== b.iso)) {
      const sel = $('daySel');
      const cur = b && b.iso;
      sel.innerHTML = days.map((d) => '<option value="' + esc(d) + '"' + (d === cur ? ' selected' : '') + '>' +
        esc(d.slice(8, 10) + '/' + d.slice(5, 7)) + '</option>').join('');
      if (cur && !days.includes(cur)) sel.insertAdjacentHTML('afterbegin', '<option value="' + esc(cur) + '" selected>' + esc(cur.slice(8, 10) + '/' + cur.slice(5, 7)) + '</option>');
      sel.hidden = false;
      sel.onchange = async () => {
        if (b && sel.value === b.iso) { show(b, true); return; }
        $('content').innerHTML = '<div class="empty">Loading…</div>';
        try {
          const old = await core.loadBriefingDay(sel.value);
          if (old) show(old, false);
          else $('content').innerHTML = '<div class="empty">Nothing archived for that day.</div>';
        } catch (e2) { $('content').innerHTML = '<div class="empty">' + esc(e2.message) + '</div>'; }
      };
    }
  } catch (e) { /* history is optional; today already rendered */ }
} catch (e) {
  $('content').innerHTML = '<div class="empty">Could not load the briefing: ' + esc(e.message) + '</div>';
}
core.installPalette({});
}
</script>
</body>
</html>
