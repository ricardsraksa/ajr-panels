<main class="v2-main">
  <div class="colw">
    <header class="v2-h">
      <h1>Leadpools</h1>
      <span class="sub" id="count">—</span>
      <span class="sp"></span>
      <button class="v2-btn sm" id="refresh" type="button">Refresh</button>
    </header>
    <div class="sumline" id="sumline"></div>
    <div class="v2-card" id="list"><div class="v2-empty">Loading…</div></div>
  </div>
</main>

<script type="module">
import * as core from './crm-core.js?v=20260805b';
const session = await core.requireAuth();
if (session) {
await core.installChrome({ active: 'leadpools' });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const toast = core.toast;
let leads = [];

const pools = () => leads.filter((l) => l.lp);
// the workable ones first: good+unused, then unrated, bad and used sink
const rank = (l) => (l.lpQuality === 'good' ? 30 : l.lpQuality === 'bad' ? 10 : 20) + (l.lpUsed ? 0 : 5);

function render() {
  const p = pools().sort((a, b) => rank(b) - rank(a));
  $('count').textContent = p.length ? p.length + ' pool' + (p.length === 1 ? '' : 's') : 'none yet';
  const unused = p.filter((l) => !l.lpUsed).length;
  const good = p.filter((l) => l.lpQuality === 'good').length;
  $('sumline').innerHTML = p.length
    ? '<b>' + unused + '</b> unused · <b>' + good + '</b> rated good — accounts whose audience feeds prospecting'
    : '';
  if (!p.length) {
    $('list').innerHTML = '<div class="empty-p"><b>No leadpools marked yet.</b><br>' +
      'Open any lead on All leads and tick “Leadpool” in the drawer — accounts whose followers and commenters are worth mining show up here.</div>';
    return;
  }
  $('list').innerHTML = p.map((l) => `
    <div class="p-row${l.lpUsed ? ' used' : ''}" data-id="${l.id}">
      <a class="p-h" href="${esc(l.url || 'https://instagram.com/' + l.h)}" target="_blank" rel="noopener">@${esc(l.h)}</a>
      ${l.qual ? '<span class="p-qual">' + esc(l.qual.replace('Qualified ', 'Q')) + '</span>' : ''}
      <span class="p-note" title="${esc(l.notes || '')}">${esc(core.notesOneLine(l.notes || ''))}</span>
      <div class="tf" role="group" aria-label="Quality">
        <button type="button" data-q="good" aria-pressed="${l.lpQuality === 'good'}">Good</button>
        <button type="button" data-q="bad" aria-pressed="${l.lpQuality === 'bad'}">Bad</button>
      </div>
      <div class="tf" role="group" aria-label="Used">
        <button type="button" data-u="0" aria-pressed="${!l.lpUsed}">Unused</button>
        <button type="button" data-u="1" aria-pressed="${l.lpUsed}">Used</button>
      </div>
      <button class="p-x" data-x title="Not a pool — unmarks it, the lead itself stays">✕</button>
    </div>`).join('');
}

async function save(l, fields, revert) {
  try {
    await core.setLead(l.id, fields);
    render();
  } catch (err) {
    revert();
    render();
    toast({ type: 'err', html: 'Save failed: ' + esc(err.message), sticky: true });
  }
}

$('list').addEventListener('click', (e) => {
  const row = e.target.closest('.p-row'); if (!row) return;
  const l = leads.find((x) => x.id === +row.getAttribute('data-id')); if (!l) return;
  const q = e.target.closest('button[data-q]');
  if (q) {
    const prev = l.lpQuality;
    const v = q.getAttribute('data-q');
    l.lpQuality = l.lpQuality === v ? '' : v;   // tap again to clear
    save(l, { lpQuality: l.lpQuality }, () => { l.lpQuality = prev; });
    render(); return;
  }
  const u = e.target.closest('button[data-u]');
  if (u) {
    const prev = l.lpUsed;
    l.lpUsed = u.getAttribute('data-u') === '1';
    if (l.lpUsed !== prev) save(l, { lpUsed: l.lpUsed }, () => { l.lpUsed = prev; });
    render(); return;
  }
  if (e.target.closest('[data-x]')) {
    const prev = { lp: l.lp, lpQuality: l.lpQuality, lpUsed: l.lpUsed };
    l.lp = false;
    save(l, { lp: false, lpQuality: '', lpUsed: false }, () => Object.assign(l, prev));
    render();
    toast({ type: 'ok', ttl: 8000, html: '<span class="mono">@' + esc(l.h) + '</span> unmarked — the lead itself is untouched.',
      action: { label: 'Undo', fn: () => { Object.assign(l, prev); save(l, prev, () => { l.lp = false; }); render(); } } });
  }
});

async function load() {
  try { leads = await core.loadLeads(); render(); }
  catch (e) { $('list').innerHTML = '<div class="v2-empty">Couldn’t load: ' + esc(e.message) + '</div>'; }
}
$('refresh').onclick = load;
core.installPalette({});
load();
}
</script>
</body>
</html>
