<main class="v2-main">
  <div class="colw">
    <header class="v2-h">
      <h1>Handover</h1>
      <span class="sub" id="count">—</span>
      <span class="sp"></span>
      <button class="v2-btn go sm" id="addAll" hidden>Add all to deals</button>
      <a class="v2-btn sm" href="deals.html">← Deals</a>
    </header>
    <p class="v2-lab" style="margin:0 0 12px">Leads marked Booked or Closed whose deal was never created — the closing CRM can't see them until they're added.</p>
    <div id="list"><div class="v2-empty v2-card">Checking…</div></div>
  </div>
</main>

<script type="module">
import * as core from './crm-core.js?v=20260726d';
const session = await core.requireAuth();
if (session) {
await core.installChrome({ active: 'deals' });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const toast = core.toast;
let miss = [];

function render() {
  $('count').textContent = miss.length ? miss.length + ' to hand over' : 'all clear';
  $('addAll').hidden = miss.length < 2;
  $('addAll').textContent = 'Add all ' + miss.length + ' to deals';
  $('list').innerHTML = miss.length ? miss.map((l) =>
    '<div class="hrow" data-id="' + esc(l.id) + '">' +
      '<span class="who"><a href="' + esc(l.url || 'https://instagram.com/' + l.h) + '" target="_blank" rel="noopener">@' + esc(l.h) + '</a></span>' +
      (l.level === 'Closed' ? '<span class="meta" style="color:#b4543e;font-weight:600">CLOSED, never recorded</span>' : '') +
      (l.qual ? '<span class="meta">' + esc(l.qual) + '</span>' : '') +
      (l.lastContact ? '<span class="meta">last touch ' + esc(l.lastContact) + '</span>' : '') +
      (l.notes ? '<span class="meta" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px" title="' + esc(l.notes) + '">' + esc(core.notesOneLine(l.notes)) + '</span>' : '') +
      '<span class="sp"></span>' +
      '<button data-add>Add to deals</button>' +
    '</div>').join('')
    : '<div class="allclear v2-card"><b>Every booked lead has a deal.</b>Nothing waiting for the closer.</div>';
}

async function load() {
  try { miss = await core.bookedWithoutDeal(); } catch (e) {
    $('list').innerHTML = '<div class="v2-empty v2-card">Couldn’t check: ' + esc(e.message) + '</div>';
    return;
  }
  render();
}

$('list').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-add]'); if (!btn) return;
  const row = btn.closest('.hrow');
  const lead = miss.find((l) => String(l.id) === row.getAttribute('data-id'));
  if (!lead) return;
  btn.disabled = true; btn.textContent = 'Adding…';
  try {
    await core.createMissingDeal(lead);
    miss = miss.filter((l) => l !== lead);
    render();
    toast({ type: 'ok', html: '<span class="mono">@' + esc(lead.h) + '</span> added to deals.' });
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Add to deals';
    toast({ type: 'err', html: 'Couldn’t add: ' + esc(err.message), sticky: true });
  }
});

$('addAll').onclick = async () => {
  const btn = $('addAll');
  btn.disabled = true;
  const batch = miss.slice();
  let ok = 0, failed = 0;
  for (const lead of batch) {
    btn.textContent = 'Adding ' + (ok + failed + 1) + ' of ' + batch.length + '…';
    try { await core.createMissingDeal(lead); miss = miss.filter((l) => l !== lead); ok++; }
    catch (e) { failed++; }
    render();
  }
  btn.disabled = false;
  toast(failed
    ? { type: 'err', sticky: true, html: '<b>' + ok + '</b> added, <b>' + failed + '</b> failed — retry the rows still listed.' }
    : { type: 'ok', ttl: 9000, html: '<b>' + ok + '</b> added to deals. The Closed ones still need their cash recorded.' });
};

core.installPalette({});
load();
}
</script>
